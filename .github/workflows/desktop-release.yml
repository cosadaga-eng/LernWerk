name: Desktop Installer Build

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-installers:
    name: Installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform_flag: --win
            artifact: LernWerk-Windows-Installer
          - os: macos-latest
            platform_flag: --mac
            artifact: LernWerk-macOS-Installer
          - os: ubuntu-latest
            platform_flag: --linux
            artifact: LernWerk-Linux-Installer

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6

      - name: Node.js einrichten
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Abhängigkeiten installieren
        shell: bash
        run: |
          rm -f bun.lock
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund || npm install --no-audit --no-fund --legacy-peer-deps
          else
            npm install --no-audit --no-fund --legacy-peer-deps
          fi

      - name: Web-Bundle bauen
        shell: bash
        run: npm run build

      - name: Desktop-Installer erstellen
        shell: bash
        run: npx --no-install electron-builder ${{ matrix.platform_flag }} --config electron-builder.yml --publish never

      - name: Installer als Artefakt hochladen
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

      - name: Release-Dateien bei Tag veröffentlichen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
