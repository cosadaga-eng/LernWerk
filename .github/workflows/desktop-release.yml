name: Desktop Installer Build

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows Installer
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6

      - name: Node.js einrichten
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Abhängigkeiten installieren
        run: |
          if (Test-Path package-lock.json) {
            npm ci --no-audit --no-fund
          } else {
            npm install --no-audit --no-fund --legacy-peer-deps
          }

      - name: Web-Bundle bauen
        run: npm run build

      - name: Desktop-Installer erstellen
        run: npx --no-install electron-builder --win --config electron-builder.yml --publish never

      - name: Installer als Artefakt hochladen
        uses: actions/upload-artifact@v6
        with:
          name: LernWerk-Windows-Installer
          path: release/*.exe
          if-no-files-found: error

  build-linux:
    name: Linux Installer
    runs-on: ubuntu-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6

      - name: Node.js einrichten
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Abhängigkeiten installieren
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund || npm install --no-audit --no-fund --legacy-peer-deps
          else
            npm install --no-audit --no-fund --legacy-peer-deps
          fi

      - name: Web-Bundle bauen
        shell: bash
        run: npm run build

      - name: Desktop-Installer erstellen
        shell: bash
        run: npx --no-install electron-builder --linux --config electron-builder.yml --publish never

      - name: Installer als Artefakt hochladen
        uses: actions/upload-artifact@v6
        with:
          name: LernWerk-Linux-Installer
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

      - name: Release-Dateien bei Tag veröffentlichen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release/*.exe
            release/*.AppImage
            release/*.deb
